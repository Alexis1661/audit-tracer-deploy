# Despliegue del dashboard central en Render (Blueprint).
# Render lee este archivo al crear el servicio con "New > Blueprint".
services:
  - type: web
    name: audit-tracer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # SRV-I2 / SRV-D2: servidor WSGI (Gunicorn), no el servidor de desarrollo.
    # Un proceso con varios hilos: la base es SQLite y el publicador de Merkle
    # debe correr una sola vez (ver wsgi.py).
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Sin modo debug en un servidor público.
      - key: FLASK_DEBUG
        value: "0"
      # Crea las cuentas de demo al arrancar (el disco del plan free es
      # efímero: la base se recrea en cada reinicio). B10: las contraseñas ya
      # no están en el código; se toman de SEED_DEMO_PASSWORD (definirla en el
      # panel de Render) o se generan y se imprimen una vez en el log.
      - key: SEED_DEMO_DATA
        value: "1"
      - key: SEED_DEMO_PASSWORD
        sync: false
      # CAN-T2: todo evento sincronizado debe venir firmado.
      - key: AUDIT_EXIGIR_FIRMA
        value: "1"
      # Render termina HTTPS en su proxy: confiar en X-Forwarded-Proto para
      # que /api/eventos/sincronizar no rechace tráfico HTTPS legítimo (HU-5.6).
      - key: TRUST_PROXY_HEADERS
        value: "1"
      # Clave de la cookie de sesión (HU-6.5): Render genera una aleatoria.
      - key: SECRET_KEY
        generateValue: true
