[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-tracer"
version = "0.1.0"
description = "Auditoría de trazabilidad automática para ciencia de datos en salud (PDGTRAZDSA)"
readme = "docs/guia_instalacion_uso.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14.0"]
servidor = ["Flask>=2.3"]
dev = [
    "pytest>=7.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "Flask>=2.3",
]

[tool.setuptools.packages.find]
include = ["audit_tracer*"]

[tool.setuptools.package-data]
audit_tracer = ["schema/*.sql"]
