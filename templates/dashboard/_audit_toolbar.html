{% if session.get('usuario_id') %}
<header class="audit-toolbar" aria-label="Herramientas del panel">
    {% if audit_available %}
    <nav class="audit-toolbar__links" aria-label="Espacio de auditoría">
        <a href="{{ url_for('audit.explore') }}" {% if request.endpoint in ('audit.explore', 'audit.relations') %}aria-current="page"{% endif %}>Explorar</a>
        {% if audit_alert_available %}
        <a href="{{ url_for('audit.alerts') }}" {% if request.endpoint in ('audit.alerts', 'audit.alert_review') %}aria-current="page"{% endif %}>Alertas</a>
        {% endif %}
    </nav>
    <form class="audit-global-search" role="search" aria-label="Búsqueda global" action="{{ url_for('audit.explore') }}" method="get">
        <label for="audit-global-query" class="audit-visually-hidden">Buscar por usuario, evento, dataset, hash o sesión</label>
        <input id="audit-global-query" type="search" name="q" maxlength="160" placeholder="Buscar en auditoría" aria-keyshortcuts="Control+K Meta+K" required>
        <button class="audit-tool-button" type="submit">Buscar</button>
    </form>
    {% if audit_alert_available %}
    <a class="audit-tool-button audit-notification-link" href="{{ url_for('audit.notifications') }}" title="Notificaciones" aria-label="Notificaciones" {% if request.endpoint == 'audit.notifications' %}aria-current="page"{% endif %}>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
        </svg>
        <span id="audit-unread" data-url="{{ url_for('audit.notification_status') }}" aria-hidden="true" hidden></span>
    </a>
    <span id="audit-unread-status" class="audit-visually-hidden" role="status"></span>
    {% endif %}
    {% endif %}
    <details class="audit-appearance">
        <summary class="audit-tool-button">Apariencia</summary>
        <div class="audit-appearance__panel">
            <label for="audit-theme">Tema</label>
            <select id="audit-theme" data-audit-setting="theme">
                <option value="system">Sistema</option>
                <option value="light">Claro</option>
                <option value="dark">Oscuro</option>
            </select>
            <label for="audit-text-size">Tamaño de texto</label>
            <select id="audit-text-size" data-audit-setting="size">
                <option value="normal">Normal</option>
                <option value="large">Grande</option>
                <option value="extra-large">Muy grande</option>
            </select>
            <label class="audit-appearance__checkbox">
                <input type="checkbox" data-audit-setting="contrast"> Alto contraste
            </label>
            {% if audit_available %}<small>Pulsa <kbd>Ctrl</kbd> + <kbd>K</kbd> (o <kbd>⌘</kbd> + <kbd>K</kbd>) para buscar.</small>{% endif %}
        </div>
    </details>
</header>
{% endif %}
